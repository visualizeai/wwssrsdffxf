<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leticia</title>
  <style>
    :root{
      --bg1:#0f172a;
      --bg2:#1f2937;
      --card: rgba(255,255,255,.08);
      --stroke: rgba(255,255,255,.14);
      --text:#e5e7eb;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
      color:var(--text);
      background:
        radial-gradient(900px 500px at 20% 20%, #7c3aed55, transparent 60%),
        radial-gradient(900px 500px at 80% 30%, #06b6d455, transparent 60%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      padding:24px;
    }
    .card{
      width:min(720px, 100%);
      padding:48px 36px;
      border-radius:24px;
      background: var(--card);
      border:1px solid var(--stroke);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      text-align:center;
    }
    h1{
      margin:0;
      font-size: clamp(32px, 6vw, 64px);
      letter-spacing: .08em;
      text-transform: uppercase;
      line-height:1.05;
      background: linear-gradient(90deg, #a78bfa, #22d3ee, #34d399);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p{
      margin:14px 0 0;
      opacity:.85;
      font-size: 16px;
    }
    .pill{
      display:inline-block;
      margin-top:22px;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.06);
      font-size: 13px;
      letter-spacing:.04em;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>LETICIA É LINDA</h1>
    <p>Uma página simples, moderna e bem apresentável.</p>
    <div class="pill">Nexa Builde • Página inicial</div>
  </main>
</body>
</html>
